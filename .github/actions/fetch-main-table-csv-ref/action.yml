name: 'Fetch Main Table CSV Reference'
description: 'Fetches the currently table csv of the main build'
inputs:
  repo:
    description: "Execute repository"
    required: true
  parentDir:
    description: "The directory, which contains all table test"
    required: true
  referenceDir:
    description: "The name of directory, which contains the references"

runs:
  using: "composite"
  steps:
    - name: Get last Build Number
      shell: bash
      run: |
        LAST_MAIN_BUILD=$(gh run list --repo ${{ inputs.repo }} --workflow "Build SET" --branch main --status completed --json number,databaseId,event --jq 'map(select(.event == "push")) | sort_by(.number) | last')
        LAST_BUILD_NUMBER=$(echo $LAST_MAIN_BUILD | jq -r '.number')
        LAST_BUILD_ID=$(echo $LAST_MAIN_BUILD | jq -r '.databaseId')
        echo "Last Build Number & ID: $LAST_BUILD_NUMBER, $LAST_BUILD_ID"
        echo "LAST_BUILD_NUMBER=$LAST_BUILD_NUMBER" >> $GITHUB_ENV
        echo "LAST_BUILD_ID=$LAST_BUILD_ID" >> $GITHUB_ENV
    
    - name: Download Main Table CSV Reference
      id: download-artifact
      uses: actions/download-artifact@v4
      with:
        name: "table-csv-${{ env.LAST_BUILD_NUMBER }}"
        run-id: ${{ env.LAST_BUILD_ID }}
        path: main-reference-csv
        github-token: ${{ env.GITHUB_TOKEN }}
        repository: ${{ inputs.repo }}
      continue-on-error: true
    
    - name: Trigger Main Build If Not Found
      if: steps.download-artifact.outcome == 'failure'
      shell: bash
      run: |
        echo "Rerun main build ${{ env.LAST_BUILD_ID }}"
        gh run rerun ${{ env.LAST_BUILD_ID }} --repo ${{ inputs.repo }}
        echo "Waiting for the build to finish..."
        gh run watch ${{ env.LAST_BUILD_ID }} --repo ${{ inputs.repo }} --interval 60
    
    - name: Redownload Main Table CSV Reference
      if: steps.download-artifact.outcome == 'failure'
      uses: actions/download-artifact@v4
      with:
        name: "table-csv-${{ env.LAST_BUILD_NUMBER }}"
        run-id: ${{ env.LAST_BUILD_ID }}
        path: main-reference-csv
        github-token: ${{ env.GITHUB_TOKEN }}
        repository: ${{ inputs.repo }}
    
    - name: Update current table csv
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        python -c "
          import os
          import shutil

          def collect_references_dir(parent_dir: str, reference_dir_name: str, references_dir_list: list[str] = []) -> list[str]:
            if not os.path.exists(parent_dir) or not os.path.isdir(parent_dir) or not os.listdir(parent_dir):
              return []

            for sub_dir in os.listdir(parent_dir):
              sub_dir_path = f"{parent_dir}/{sub_dir}"
              if os.path.exists(sub_dir_path) and os.path.isdir(sub_dir_path):
                if sub_dir == reference_dir_name:
                  references_dir_list.append(sub_dir_path)
                else:
                  collect_references_dir(sub_dir_path, reference_dir_name, references_dir_list)
            return references_dir_list

          reference_dirs = collect_references_dir("${{inputs.parentDir}}", "${{inputs.referenceDir}}")
          if not reference_dirs:
            raise SystemError("Can't find table reference dirs")

          for root, _, files in os.walk('main-reference-csv'):
            for file in files:
              if not file.endswith('_current.csv'):
                continue
              source_path = os.path.join(root, file)
              ref_path = source_path.replace('main-reference-csv', '').replace('_current.csv', '_reference.csv')
              dest_path_founded = False
              for table_reference_dir in reference_dirs:
                dest_path = f"{table_reference_dir}/{ref_path}"
                if os.path.exists(dest_path):
                  dest_path_founded = True
                  shutil.move(source_path, dest_path)
                  print(f'Moved: {source_path} -> {dest_path}')
              
              if not dest_path_founded:
                for table_reference_dir in reference_dirs:
                  dest_path = f"{table_reference_dir}/{ref_path}"
                  if not os.path.exists(dest_path):
                    os.makedirs(dest_path)
                  shutil.copy(source_path, dest_path)
                  print(f'Copy: {source_path} -> {dest_path}')
        "
